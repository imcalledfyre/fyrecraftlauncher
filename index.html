<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FyreX Games V5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- Phosphor Icons for the game bar -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        // Service Worker registration for PWA capabilities
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(() => console.log('Service worker registered'))
                .catch(e => console.log('SW registration failed', e));
        }
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Segoe UI', 'Inter', 'sans-serif'], // Segoe UI for Win7 feel
                        display: ['Segoe UI', 'Poppins', 'sans-serif'],
                    },
                    colors: {
                        'aero-blue': 'rgba(20, 40, 60, 0.4)',
                        'fyre-primary': '#00d2ff', /* Cyan/Blue for Aero */
                        'fyre-secondary': '#ffffff', 
                        'text-main': '#ffffff',
                    },
                    animation: {
                        'gradient': 'gradient 20s ease infinite',
                        'fade-in': 'fadeIn 0.4s ease-out forwards',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        gradient: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        },
                        fadeIn: {
                            'from': { opacity: '0', transform: 'translateY(10px)' },
                            'to': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

<style>
    /* --- CSS Color Shift Background --- */
    body {
        margin: 0;
        font-family: 'Segoe UI', 'Inter', sans-serif;
        color: white;
        /* Deep, rich animated gradient suitable for Aero */
        background: linear-gradient(-45deg, #004e92, #000428, #2b32b2, #1488cc);
        background-size: 400% 400%;
        animation: gradient 20s ease infinite;
        overflow-x: hidden;
        min-height: 100vh;
    }

    /* --- Aero Glass Theme --- */
    .aero-panel {
        background: rgba(15, 25, 40, 0.45); /* Darker transparent base */
        backdrop-filter: blur(15px) saturate(120%);
        -webkit-backdrop-filter: blur(15px) saturate(120%);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-top: 1px solid rgba(255, 255, 255, 0.5); /* Highlight top edge */
        border-bottom: 1px solid rgba(0, 0, 0, 0.3);
        box-shadow: 
            0 10px 40px rgba(0, 0, 0, 0.4),
            inset 0 0 0 1px rgba(255, 255, 255, 0.05);
        position: relative;
        overflow: hidden; /* Contains the shine */
    }

    /* The "Aero Shine" Effect */
    .aero-panel::before {
        content: "";
        position: absolute;
        top: 0; left: 0; right: 0; 
        height: 45%; /* Top half shine */
        background: linear-gradient(
            to bottom, 
            rgba(255, 255, 255, 0.15) 0%, 
            rgba(255, 255, 255, 0.05) 90%, 
            rgba(255, 255, 255, 0.0) 100%
        );
        pointer-events: none;
        z-index: 0;
        border-radius: inherit; /* Follow container corners */
    }
    
    /* Ensure content sits above the shine */
    .aero-content {
        position: relative;
        z-index: 1;
    }

    .aero-input {
        background: rgba(0, 0, 0, 0.3);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-top: 1px solid rgba(0, 0, 0, 0.5); /* Inset look */
        color: white;
        box-shadow: inset 0 2px 5px rgba(0,0,0,0.2);
    }
    .aero-input:focus {
        background: rgba(0, 0, 0, 0.5);
        border-color: #00d2ff;
        outline: none;
        box-shadow: 0 0 10px rgba(0, 210, 255, 0.3), inset 0 2px 5px rgba(0,0,0,0.2);
    }

    .aero-button {
        background: linear-gradient(to bottom, rgba(255,255,255,0.1), rgba(255,255,255,0));
        border: 1px solid rgba(255,255,255,0.3);
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        text-shadow: 0 1px 2px rgba(0,0,0,0.5);
    }
    .aero-button:hover {
        background: linear-gradient(to bottom, rgba(255,255,255,0.2), rgba(255,255,255,0.05));
        box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        border-color: #00d2ff;
    }

    /* Game Tiles */
    .game-tile {
        aspect-ratio: 1 / 1;
        background-size: cover;
        background-position: center;
        border-radius: 0.75rem;
        position: relative;
        cursor: pointer;
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        border: 1px solid rgba(255, 255, 255, 0.2);
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        background-color: #000;
    }
    
    /* Tile glass overlay */
    .game-tile::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to bottom, rgba(255,255,255,0.1) 0%, transparent 40%, rgba(0,0,0,0.8) 100%);
        z-index: 1;
        transition: opacity 0.3s;
    }
    
    .game-tile:hover:not(.banned-disabled) {
        transform: translateY(-5px) scale(1.02);
        box-shadow: 0 15px 30px rgba(0, 210, 255, 0.25);
        border-color: #00d2ff;
    }
    
    .game-tile-info {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        z-index: 2;
        padding: 0.75rem;
    }

    /* Banned State */
    .game-tile.banned-disabled {
        filter: grayscale(100%);
        opacity: 0.5;
        cursor: not-allowed;
    }

    /* --- Immersive Iframe Overlay --- */
    #immersive-container {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #000;
        flex-direction: column;
    }

    #immersive-bar {
        height: 48px;
        background: linear-gradient(to bottom, #1a1a1a, #000);
        border-bottom: 1px solid #333;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 1rem;
    }

    #game-iframe {
        flex-grow: 1;
        width: 100%;
        border: none;
        background: #000;
        display: block;
    }
    
    /* Custom Scrollbar for Aero Feel */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-thumb { 
        background: rgba(255, 255, 255, 0.2); 
        border-radius: 5px; 
        border: 2px solid transparent; 
        background-clip: content-box; 
    }
    ::-webkit-scrollbar-thumb:hover { background-color: rgba(255, 255, 255, 0.4); }
    ::-webkit-scrollbar-track { background: transparent; }

</style>
</head>
<body class="selection:bg-fyre-primary selection:text-white">

    <!-- Banned Overlay -->
    <div id="banned-overlay" class="hidden fixed inset-0 bg-red-900/90 flex items-center justify-center z-[500] backdrop-blur-md">
        <div class="aero-panel p-10 rounded-2xl text-center max-w-md mx-4">
            <div class="aero-content">
                <i class="ph ph-warning-octagon text-6xl text-red-400 mb-4"></i>
                <h2 class="text-4xl font-extrabold text-white mb-3 tracking-widest uppercase" style="text-shadow: 0 0 20px red;">BANNED</h2>
                <p class="text-lg text-red-100">Access Restricted Permanently.</p>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <div id="auth-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-md">
        <div class="aero-panel p-8 rounded-xl shadow-2xl w-full max-w-sm m-4 animate-fade-in">
            <div class="aero-content">
                <h2 class="text-3xl font-bold text-center mb-1 text-white drop-shadow-md" id="auth-title">FyreX V5</h2>
                <p class="text-center text-blue-200 text-sm mb-6 opacity-80">Secure Gateway</p>
                
                <form id="auth-form" onsubmit="handleAuth(event)">
                    <div class="mb-4">
                        <input type="text" id="auth-username" name="username" placeholder="Username" required 
                               class="aero-input w-full px-4 py-2.5 rounded-lg transition duration-200 text-sm">
                    </div>
                    <div class="mb-6">
                        <input type="password" id="auth-password" name="password" placeholder="Password" required 
                               class="aero-input w-full px-4 py-2.5 rounded-lg transition duration-200 text-sm">
                    </div>
                    <button type="submit" id="auth-button"
                            class="aero-button w-full py-2.5 rounded-lg font-bold text-white transition duration-200">
                        Log In
                    </button>
                </form>
                
                <p class="text-center text-sm mt-5">
                    <span class="text-gray-300" id="auth-toggle-text">New here?</span>
                    <button onclick="toggleAuthMode()" class="text-fyre-primary hover:text-white font-semibold ml-1 transition" style="text-shadow: 0 0 10px rgba(0,210,255,0.5);">
                        Sign Up
                    </button>
                </p>
                <p id="auth-message" class="text-center mt-4 text-sm font-medium text-red-400"></p>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTENT -->
    <div id="app-container" class="relative z-10 p-4 sm:p-6 transition-opacity duration-500 min-h-screen flex flex-col">
        
        <!-- Header -->
        <header class="aero-panel rounded-xl p-4 mb-6 flex flex-col sm:flex-row justify-between items-center">
            <div class="aero-content flex items-center gap-3 mb-4 sm:mb-0 w-full sm:w-auto">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-br from-blue-500 to-indigo-600 flex items-center justify-center shadow-lg border border-white/20">
                    <i class="ph-bold ph-game-controller text-2xl text-white"></i>
                </div>
                <h1 class="text-2xl font-bold tracking-tight text-white drop-shadow-lg">FyreX <span class="text-fyre-primary font-light">V5</span></h1>
            </div>
            
            <div class="aero-content flex items-center space-x-3 w-full sm:w-auto justify-end">
                <div class="aero-input px-3 py-1.5 rounded-full flex items-center gap-2">
                    <i class="ph-fill ph-coins text-yellow-400"></i>
                    <span id="fyre-coins-counter" class="font-bold text-white text-sm">---</span>
                </div>
                
                <div class="text-right hidden sm:block px-2">
                    <p class="text-[10px] text-blue-200 uppercase tracking-widest opacity-70">Operator</p>
                    <p class="font-semibold text-white truncate max-w-[120px] text-sm" id="current-username">Guest</p>
                </div>
                
                <span class="px-3 py-1 rounded-full text-[10px] font-bold bg-black/40 text-gray-400 border border-white/10" id="conn-status">Waiting...</span>
                
                <button onclick="logout()" class="p-2 hover:bg-red-500/20 rounded-full transition text-red-300 hover:text-red-100" title="Logout">
                    <i class="ph-bold ph-sign-out text-lg"></i>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-grow">
            
            <!-- Game Library Section -->
            <div class="lg:col-span-2 flex flex-col">
                <div class="aero-panel p-4 rounded-xl mb-6">
                    <div class="aero-content flex flex-col sm:flex-row gap-4">
                        <div class="relative flex-grow">
                            <i class="ph ph-magnifying-glass absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
                            <input type="text" id="game-search-input" placeholder="Search system..." 
                                   class="aero-input w-full pl-10 pr-4 py-2 rounded-lg focus:ring-1 focus:ring-fyre-primary transition-all">
                        </div>
                        <select id="sort-order-select" onchange="renderGames(document.getElementById('game-search-input').value, this.value)"
                                class="aero-input px-4 py-2 rounded-lg cursor-pointer">
                            <option value="rating">★ Rating</option>
                            <option value="name">Aa Name</option>
                        </select>
                    </div>
                </div>

                <div id="game-list" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-4 xl:grid-cols-5 gap-4 pb-10">
                    <div id="loading-game-msg" class="text-center text-blue-200 italic col-span-full py-10 opacity-70">
                        <div class="inline-block w-8 h-8 border-4 border-fyre-primary border-t-transparent rounded-full animate-spin mb-2"></div>
                        <p>Initializing Game Database...</p>
                    </div>
                </div>
            </div>

            <!-- Sidebar (Chat & Status) -->
            <div class="flex flex-col gap-6">
                <!-- Status Panel -->
                <div class="aero-panel p-5 rounded-xl">
                    <div class="aero-content">
                        <h3 class="text-sm font-bold text-white mb-2 flex items-center gap-2 uppercase tracking-wider opacity-80">
                            <i class="ph-fill ph-broadcast text-green-400 animate-pulse"></i> Network
                        </h3>
                        <p class="text-xs text-blue-100 mb-2">Users Online: <span id="online-count" class="font-bold text-white text-sm">0</span></p>
                        <div id="dm-notification-area" class="hidden p-3 bg-blue-900/40 border border-blue-400/30 rounded-lg animate-fade-in backdrop-blur-sm">
                            <p class="font-semibold text-blue-300 text-[10px] uppercase tracking-wide">Private Signal</p>
                            <p class="text-sm text-white truncate" id="dm-notification-content"></p>
                        </div>
                    </div>
                </div>

                <!-- Chat Panel -->
                <div class="aero-panel p-4 rounded-xl flex flex-col h-[500px]">
                    <div class="aero-content h-full flex flex-col">
                        <h3 class="text-sm font-bold text-white mb-3 flex items-center gap-2 border-b border-white/10 pb-2 uppercase tracking-wider opacity-80">
                            <i class="ph-bold ph-chat-circle-dots"></i> Global Chat
                        </h3>
                        
                        <div id="chat-messages" class="flex-grow overflow-y-auto space-y-2 mb-3 pr-2 text-sm scroll-smooth">
                            <div id="loading-chat-msg" class="text-center text-blue-200 italic text-xs mt-10 opacity-60">Connecting to relay...</div>
                        </div>
                        
                        <form id="chat-form" onsubmit="sendChatMessage(event)" class="flex gap-2 relative">
                            <input type="text" id="chat-input" placeholder="Type a message..." required
                                   class="aero-input flex-grow px-3 py-2 rounded-lg text-sm w-full pr-10">
                            <button type="submit" id="chat-send-button"
                                    class="absolute right-1 top-1 bottom-1 px-3 text-fyre-primary hover:text-white transition">
                                <i class="ph-bold ph-paper-plane-right"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- IMMERSIVE GAME OVERLAY -->
    <div id="immersive-container">
        <!-- Top Bar -->
        <div id="immersive-bar">
            <div class="flex items-center gap-3">
                <span class="font-bold text-white text-lg tracking-tight">FyreX</span>
                <span class="text-gray-600 text-sm">|</span>
                <span id="immersive-game-title" class="text-gray-300 text-sm font-medium">Game</span>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="reloadGame()" class="p-2 rounded hover:bg-white/10 text-gray-400 hover:text-white transition" title="Reload">
                    <i class="ph-bold ph-arrow-clockwise text-lg"></i>
                </button>
                <button onclick="toggleFullscreen()" class="p-2 rounded hover:bg-white/10 text-gray-400 hover:text-white transition" title="Fullscreen">
                    <i class="ph-bold ph-corners-out text-lg"></i>
                </button>
                <button onclick="closeImmersive()" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1 rounded text-xs font-bold transition ml-2">
                    EXIT
                </button>
            </div>
        </div>
        
        <!-- Game Iframe: Permissions maximized, Sandbox removed for "New Tab" behavior -->
        <iframe 
            id="game-iframe" 
            src="about:blank" 
            allowfullscreen 
            allow="autoplay; fullscreen; gamepad; clipboard-write; accelerometer; gyroscope"
            frameborder="0">
        </iframe>
    </div>

    <script>
        // --- Configuration & State ---
        const BACKEND_URL = 'https://oopsiepoopsie.imcalledfyre.com';
        
        let socket = null;
        let authMode = 'login';
        let authToken = localStorage.getItem('fyrexToken') || '';
        let authUsername = localStorage.getItem('fyrexUsername') || '';
        let currentGameUrl = ''; 
        
        let fyreCoins = 0;
        let isBanned = localStorage.getItem('fyrexBannedStatus') === 'true'; 
        
        let appDataCache = {
            ratings: {},
            messages: [],
            games: []
        };

        // --- UI Update Functions ---

        function updateFyreCoinsUI(coins) {
            fyreCoins = coins;
            const el = document.getElementById('fyre-coins-counter');
            el.textContent = coins.toLocaleString();
            el.classList.add('text-green-400');
            setTimeout(() => el.classList.remove('text-green-400'), 500);
        }

        function handleBanStatus(banned) {
            isBanned = banned;
            const overlay = document.getElementById('banned-overlay');
            const chatInput = document.getElementById('chat-input');
            const chatButton = document.getElementById('chat-send-button');
            const gameTiles = document.querySelectorAll('#game-list .game-tile');

            if (banned) {
                localStorage.setItem('fyrexBannedStatus', 'true');
                overlay.classList.remove('hidden');
                
                chatInput.disabled = true;
                chatInput.placeholder = "Connection Terminated";
                chatButton.disabled = true;

                gameTiles.forEach(tile => {
                    tile.classList.add('banned-disabled');
                    tile.removeAttribute('onclick');
                });
                closeImmersive();
            } else {
                localStorage.removeItem('fyrexBannedStatus');
                overlay.classList.add('hidden');

                chatInput.disabled = false;
                chatInput.placeholder = "Type a message...";
                chatButton.disabled = false;

                gameTiles.forEach(tile => {
                    tile.classList.remove('banned-disabled');
                    // Use DIRECTORY as ID
                    const gameDir = tile.dataset.gameDir; 
                    if (gameDir) tile.setAttribute('onclick', `launchGameByDir('${gameDir}')`);
                });
            }
        }

        // --- Authentication ---

        function toggleAuthMode() {
            authMode = authMode === 'login' ? 'signup' : 'login';
            document.getElementById('auth-title').textContent = authMode === 'login' ? 'FyreX V5' : 'New Identity';
            document.getElementById('auth-button').textContent = authMode === 'login' ? 'Log In' : 'Sign Up';
            document.getElementById('auth-toggle-text').textContent = authMode === 'login' ? "New here?" : "Returning user?";
            document.getElementById('auth-message').textContent = '';
        }

        async function handleAuth(event) {
            event.preventDefault();
            const form = document.getElementById('auth-form');
            const messageElement = document.getElementById('auth-message');
            
            messageElement.textContent = 'Verifying credentials...';
            
            try {
                const response = await fetch(`${BACKEND_URL}/${authMode}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: form.elements['username'].value,
                        password: form.elements['password'].value
                    })
                });

                const result = await response.json();

                if (result.success) {
                    authToken = result.token;
                    authUsername = result.username;
                    localStorage.setItem('fyrexToken', authToken);
                    localStorage.setItem('fyrexUsername', authUsername);

                    if (result.is_banned) {
                        handleBanStatus(true);
                        document.getElementById('auth-modal').style.display = 'none';
                        document.getElementById('app-container').style.opacity = '1'; 
                        document.getElementById('current-username').textContent = authUsername;
                        connectSocket();
                    } else {
                        handleBanStatus(false);
                        messageElement.textContent = 'Access Granted.';
                        messageElement.className = 'text-center mt-4 text-sm font-medium text-green-400';
                        setTimeout(startApp, 800); 
                    }
                } else {
                    messageElement.textContent = result.message;
                }
            } catch (error) {
                console.error('Auth Error:', error);
                messageElement.textContent = `Server Unreachable.`;
            }
        }
        
        function logout() {
            localStorage.clear();
            closeImmersive();
            window.location.reload(); 
        }

        // --- WebSocket ---

        function connectSocket() {
            const statusEl = document.getElementById('conn-status');
            statusEl.textContent = 'Connecting...';
            statusEl.className = "px-3 py-1 rounded-full text-[10px] font-bold bg-yellow-500/20 text-yellow-500 border border-yellow-500/30";

            socket = io(BACKEND_URL, {
                query: { token: authToken },
                transports: ['websocket'], 
                secure: true
            });

            socket.on('connect', () => {
                statusEl.textContent = 'SECURE';
                statusEl.className = "px-3 py-1 rounded-full text-[10px] font-bold bg-green-500/20 text-green-400 border border-green-500/30 shadow-[0_0_10px_rgba(74,222,128,0.2)]";
            });

            socket.on('disconnect', () => {
                statusEl.textContent = 'OFFLINE';
                statusEl.className = "px-3 py-1 rounded-full text-[10px] font-bold bg-red-500/20 text-red-500 border border-red-500/30";
            });
            
            socket.on('banned', (data) => handleBanStatus(true));

            socket.on('initial_data', (data) => {
                appDataCache.messages = data.messages || [];
                appDataCache.ratings = data.ratings || {};
                updateFyreCoinsUI(data.fyre_coins || 0);
                document.getElementById('online-count').textContent = data.online_count || 0;
                handleBanStatus(data.is_banned || false); 

                renderChatMessages();
                const currentSearch = document.getElementById('game-search-input').value;
                const currentSort = document.getElementById('sort-order-select').value;
                renderGames(currentSearch, currentSort); 
            });
            
            socket.on('update_online_count', (count) => {
                 document.getElementById('online-count').textContent = count;
            });

            socket.on('new_message', (message) => {
                if (message.username === 'System' && message.content.includes('FyreCoin balance is:')) {
                    const match = message.content.match(/(\d+)\s+FC/);
                    if (match) updateFyreCoinsUI(parseInt(match[1]));
                }
                appDataCache.messages.push(message);
                if (appDataCache.messages.length > 50) appDataCache.messages.shift();
                
                const chatContainer = document.getElementById('chat-messages');
                const wasScrolledToBottom = chatContainer.scrollHeight - chatContainer.scrollTop <= chatContainer.clientHeight + 100;
                
                renderChatMessages();
                
                if (wasScrolledToBottom) {
                    const el = document.getElementById('chat-messages');
                    el.scrollTop = el.scrollHeight;
                }
            });
            
            socket.on('dm_received', (data) => {
                const notifArea = document.getElementById('dm-notification-area');
                const notifContent = document.getElementById('dm-notification-content');
                notifContent.textContent = `${data.from}: ${data.content}`;
                notifArea.classList.remove('hidden');
                setTimeout(() => notifArea.classList.add('hidden'), 5000);
            });
        }

        function sendChatMessage(event) {
            event.preventDefault();
            if (isBanned) return;
            const input = document.getElementById('chat-input');
            const content = input.value.trim();
            if (content && socket) {
                socket.emit('send_message', { content: content });
                input.value = '';
            }
        }

        function renderChatMessages() {
            const container = document.getElementById('chat-messages');
            if (appDataCache.messages.length === 0) {
                container.innerHTML = '<div class="text-center text-blue-200 italic text-xs mt-10 opacity-50">Silence on the frequency.</div>';
                return;
            }
            
            container.innerHTML = appDataCache.messages.map(msg => {
                const isSystem = msg.username === 'System';
                const isMe = msg.username === authUsername;
                
                let textColor = 'text-blue-200';
                if (isSystem) textColor = 'text-yellow-400 font-bold';
                else if (isMe) textColor = 'text-fyre-primary font-semibold';
                
                return `
                    <div class="break-words animate-fade-in hover:bg-white/5 p-1 rounded transition">
                        <span class="${textColor} text-xs mr-1">${msg.username}:</span>
                        <span class="text-white/90 shadow-sm">${msg.content}</span>
                    </div>
                `;
            }).join('');
        }

        // --- Game Logic ---

        async function fetchGameList() {
            try {
                // STANDARD RELATIVE FETCH - No Cache Logic
                const response = await fetch('./games.json');
                if (!response.ok) throw new Error("Manifest failed");
                
                appDataCache.games = await response.json();
                renderGames();
            } catch (error) {
                console.error("Game Load Error:", error);
                document.getElementById('loading-game-msg').innerHTML = `<p class="text-red-400">Database Connection Failed: ${error.message}</p>`;
            }
        }

        function renderGames(filterText = '', sortOrder = 'rating') {
            const list = document.getElementById('game-list');
            if (!appDataCache.games.length) return;

            list.innerHTML = '';
            
            let filtered = appDataCache.games.filter(g => g.name.toLowerCase().includes(filterText.toLowerCase()));
            
            // NOTE: Ratings might break if backend uses ID, but we try using DIRECTORY as key
            if (sortOrder === 'rating') {
                filtered.sort((a, b) => (appDataCache.ratings[b.directory]?.average || 0) - (appDataCache.ratings[a.directory]?.average || 0));
            } else {
                filtered.sort((a, b) => a.name.localeCompare(b.name));
            }

            filtered.forEach(game => {
                const div = document.createElement('div');
                div.className = `game-tile group ${isBanned ? 'banned-disabled' : ''}`;
                
                // Use directory as the unique ID
                div.dataset.gameDir = game.directory; 
                
                // FIX: Prepend /images logic
                // If game.image starts with /, assume we need to prepend /images (e.g., /logo.png -> /images/logo.png)
                // If game.image already has /images, leave it (just in case)
                let imagePath = game.image;
                if (!imagePath.startsWith('/images') && !imagePath.startsWith('http')) {
                    // Ensure we don't double slash if image is "/logo.png" -> "/images/logo.png"
                    // If image is "logo.png" -> "/images/logo.png"
                    if (imagePath.startsWith('/')) {
                        imagePath = '/images' + imagePath; 
                    } else {
                        imagePath = '/images/' + imagePath;
                    }
                }
                
                div.style.backgroundImage = `url('${imagePath}')`;
                
                if (!isBanned) {
                    div.onclick = () => launchGame(game);
                } else {
                    div.onclick = null;
                }

                // Try to get rating using directory as key
                const rating = appDataCache.ratings[game.directory]?.average?.toFixed(1) || '-';

                div.innerHTML = `
                    <div class="game-tile-info">
                        <h4 class="text-white font-bold text-sm truncate drop-shadow-md">${game.name}</h4>
                        <div class="flex justify-between items-center mt-1">
                             <span class="text-[10px] text-yellow-300 font-bold bg-black/40 px-1.5 rounded">★ ${rating}</span>
                             <span class="text-[10px] text-white/70 bg-black/40 px-1.5 rounded border border-white/10">${game.type || 'Web'}</span>
                        </div>
                    </div>
                `;
                list.appendChild(div);
            });
        }
        
        // Helper for onclick strings
        function launchGameByDir(dir) {
            const game = appDataCache.games.find(g => g.directory === dir);
            if (game) launchGame(game);
        }

        function launchGame(game) {
            const container = document.getElementById('immersive-container');
            const iframe = document.getElementById('game-iframe');
            
            // FIX: Construct path using directory
            const fullPath = `${game.directory}`;
            
            currentGameUrl = fullPath;
            iframe.src = fullPath;
            
            document.getElementById('immersive-game-title').textContent = game.name;
            container.style.display = 'flex';
        }

        function closeImmersive() {
            const container = document.getElementById('immersive-container');
            const iframe = document.getElementById('game-iframe');
            iframe.src = 'about:blank';
            container.style.display = 'none';
        }

        function reloadGame() {
            if (currentGameUrl) {
                document.getElementById('game-iframe').src = currentGameUrl;
            }
        }

        function toggleFullscreen() {
            const elem = document.getElementById('immersive-container');
            if (!document.fullscreenElement) {
                elem.requestFullscreen().catch(err => {
                    console.error(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        // --- Init ---
        
        function startApp() {
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('app-container').style.opacity = '1';
            document.getElementById('current-username').textContent = authUsername;
            connectSocket();
        }

        window.onload = function() {
            fetchGameList();
            
            // Search Listener
            document.getElementById('game-search-input').addEventListener('input', (e) => {
                const sort = document.getElementById('sort-order-select').value;
                renderGames(e.target.value, sort);
            });

            // Auth Check
            if (authToken) {
                if (localStorage.getItem('fyrexBannedStatus') === 'true') {
                    handleBanStatus(true);
                    document.getElementById('auth-modal').style.display = 'none';
                    document.getElementById('app-container').style.opacity = '1';
                    document.getElementById('current-username').textContent = authUsername;
                    connectSocket();
                } else {
                    startApp();
                }
            } else {
                document.getElementById('auth-modal').classList.remove('hidden');
                document.getElementById('app-container').style.opacity = '0'; 
                handleBanStatus(false);
            }
        };

    </script>
</body>
</html>
