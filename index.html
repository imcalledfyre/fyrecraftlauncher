<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FyreEducation | Portal</title>
    <style>
        :root { --clever-blue: #436cf2; --bg-gray: #fafbfc; --sidebar-width: 240px; }
        body { margin: 0; font-family: sans-serif; background-color: var(--bg-gray); display: flex; height: 100vh; overflow: hidden; color: #474c5e; }
        .sidebar { width: var(--sidebar-width); background: #fff; border-right: 1px solid #e3e6eb; display: flex; flex-direction: column; padding: 24px 0; }
        .clever-logo { padding: 0 24px 32px; font-size: 24px; font-weight: 900; color: var(--clever-blue); }
        .nav-link { padding: 12px 24px; font-weight: 600; font-size: 14px; cursor: pointer; border-left: 3px solid transparent; }
        .nav-link.active { background-color: rgba(67, 108, 242, 0.05); border-left-color: var(--clever-blue); color: var(--clever-blue); }
        .main-content { flex: 1; padding: 32px 48px; }
        .category-title { font-size: 18px; font-weight: 700; margin: 32px 0 16px; color: #15131c; }
        .app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 20px; }
        .app-card { background: white; border-radius: 8px; padding: 20px; text-align: center; border: 1px solid #e3e6eb; cursor: pointer; }
        .app-icon { width: 56px; height: 56px; margin: 0 auto 12px; border-radius: 12%; display: flex; align-items: center; justify-content: center; font-size: 24px; color: white; font-weight: bold; }
        
        .secure-footer {
            margin-top: 60px; padding: 25px; background: #fff; 
            border: 2px dashed var(--clever-blue); border-radius: 8px; 
            text-align: center; font-size: 14px; color: #15131c; line-height: 1.6;
        }
        .fragment { display: inline; font-weight: bold; color: var(--clever-blue); }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="clever-logo">Fyre Education</div>
        <div class="nav-link active">Homeroom</div>
        <div class="nav-link">Library</div>
    </div>

    <div class="main-content">
        <div class="category-title">Favorite Resources</div>
        <div class="app-grid">
            <div class="app-card"><div class="app-icon" style="background:#ff3b30">B</div><div class="app-label">Big Ideas Math</div></div>
            <div class="app-card"><div class="app-icon" style="background:#4cd964">I</div><div class="app-label">i-Ready</div></div>
        </div>

        <div class="secure-footer">
            <span class="fragment">TO USE SITE:</span> <br>
            <span class="fragment">CLICK 5 TIMES</span> to launch the <br>
            <span class="fragment">CLOCKED</span> site.
        </div>
    </div>

    <script>
        let clicks = 0;
        let timer;

        document.addEventListener('click', () => {
            clicks++;
            clearTimeout(timer);
            timer = setTimeout(() => { clicks = 0; }, 500);
            if (clicks === 5) { blobCloak(); clicks = 0; }
        });

        async function blobCloak() {
            try {
                const response = await fetch('./fullsite.html');
                const siteHtml = await response.text();
                
                // Masking content
                const blobContent = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>My Drive - Google Drive</title>
                        <link rel="icon" href="https://ssl.gstatic.com/docs/doclist/images/infinite_arrow_favicon_5.ico">
                        <style>body,html{margin:0;padding:0;height:100vh;overflow:hidden;background:#fff;}iframe{width:100%;height:100%;border:none;}</style>
                    </head>
                    <body>
                        <iframe src="data:text/html;base64,${btoa(unescape(encodeURIComponent(siteHtml)))}"></iframe>
                    </body>
                    </html>
                `;

                const blob = new Blob([blobContent], { type: 'text/html' });
                const blobUrl = URL.createObjectURL(blob);
                window.open(blobUrl, '_blank');
            } catch (e) {
                alert("Error: Ensure you are hosting the site (e.g., GitHub Pages) or fetch will fail.");
            }
        }
    </script>
</body>
</html>
