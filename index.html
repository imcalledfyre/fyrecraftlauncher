<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FyreX Games V5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'fyre-bg': '#050505',
                        'fyre-card': '#0f0f0f',
                        'fyre-primary': '#00f2ff',
                        'fyre-border': '#1a1a1a',
                    }
                }
            }
        }
    </script>

<style>
    body {
        background-color: #050505;
        color: #e4e4e7;
        font-family: 'Inter', system-ui, sans-serif;
        overflow-x: hidden;
    }

    /* no more aero glass, we are in our minimalist era */
    .game-card {
        background: #0f0f0f;
        border: 1px solid #1a1a1a;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .game-card:hover {
        border-color: #00f2ff;
        transform: translateY(-4px);
        box-shadow: 0 10px 30px -10px rgba(0, 242, 255, 0.3);
    }

    .img-container {
        aspect-ratio: 16/10;
        background-color: #000;
        overflow: hidden;
        border-bottom: 1px solid #1a1a1a;
    }

    /* this is needed for some reason and if it isnt there it breaks the code */
    #game-iframe {
        width: 100%;
        height: 100%;
        border: none;
    }

    /* h a b m u r g e r */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #00f2ff; }
</style>
</head>
<body class="p-4 md:p-8">

    <div id="main-view" class="max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-fyre-primary rounded-lg text-black">
                    <i class="ph-fill ph-lightning text-2xl"></i>
                </div>
                <h1 class="text-3xl font-black italic tracking-tighter uppercase">
                    FyreX <span class="text-fyre-primary">V5</span>
                </h1>
            </div>

            <div class="relative w-full md:w-80">
                <i class="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-zinc-500"></i>
                <input type="text" id="game-search-input" placeholder="Search database..." 
                       class="w-full bg-fyre-card border border-fyre-border py-3 pl-12 pr-4 rounded-xl focus:outline-none focus:border-fyre-primary transition-all text-sm">
            </div>
        </header>

        <!-- Grid -->
        <div id="game-list" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-6 gap-5">
            <!-- loading state -->
            <div class="col-span-full text-center py-20 text-zinc-500 animate-pulse">
                Fetching manifests...
            </div>
        </div>

        <!-- Pagination -->
        <div id="pagination-controls" class="mt-12 mb-20 flex justify-center items-center gap-6">
            <button id="prev-btn" onclick="changePage(-1)" class="p-3 rounded-xl bg-fyre-card border border-fyre-border hover:bg-zinc-800 disabled:opacity-20 disabled:pointer-events-none transition">
                <i class="ph-bold ph-caret-left"></i>
            </button>
            <div class="flex flex-col items-center">
                <span id="page-info" class="text-xs font-mono uppercase tracking-widest text-zinc-500">Page 1 of 1</span>
            </div>
            <button id="next-btn" onclick="changePage(1)" class="p-3 rounded-xl bg-fyre-card border border-fyre-border hover:bg-zinc-800 disabled:opacity-20 disabled:pointer-events-none transition">
                <i class="ph-bold ph-caret-right"></i>
            </button>
        </div>
    </div>

    <!-- Immersive Overlay -->
    <div id="immersive-container" class="fixed inset-0 bg-black z-[100] hidden flex-col">
        <div class="h-14 border-b border-zinc-800 flex items-center justify-between px-4 bg-zinc-950">
            <div class="flex items-center gap-3">
                <span class="text-fyre-primary font-black italic">FYREX</span>
                <span id="immersive-game-title" class="text-zinc-400 text-sm border-l border-zinc-700 pl-3">Game Title</span>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="reloadGame()" class="p-2 text-zinc-400 hover:text-white"><i class="ph-bold ph-arrow-clockwise"></i></button>
                <button onclick="toggleFullscreen()" class="p-2 text-zinc-400 hover:text-white"><i class="ph-bold ph-corners-out"></i></button>
                <button onclick="closeImmersive()" class="ml-2 px-4 py-1.5 bg-red-500/10 text-red-500 hover:bg-red-500 hover:text-white rounded-lg text-xs font-bold transition">EXIT</button>
            </div>
        </div>
        <iframe id="game-iframe" src="about:blank" allowfullscreen allow="autoplay; gamepad; accelerometer; gyroscope"></iframe>
    </div>

    <script>
        let allGames = [];
        let filteredGames = [];
        let currentPage = 1;
        const itemsPerPage = 40; // bumped up for the heavy hitters

        async function fetchGameList() {
            try {
                // In a real env, this fetches your local json
                const response = await fetch('./games.json');
                if (!response.ok) throw new Error("Database offline");
                allGames = await response.json();
                allGames.sort((a, b) => a.name.localeCompare(b.name));
                filteredGames = [...allGames];
                renderGames();
            } catch (error) {
                console.error(error);
                document.getElementById('game-list').innerHTML = `<p class="col-span-full text-center text-red-500">Failed to connect to database. Check console.</p>`;
            }
        }

        function renderGames() {
            const list = document.getElementById('game-list');
            const pageInfo = document.getElementById('page-info');
            const totalPages = Math.ceil(filteredGames.length / itemsPerPage) || 1;
            
            // Fix bounds if search reduces count
            if (currentPage > totalPages) currentPage = totalPages;
            
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const pageItems = filteredGames.slice(start, end);

            list.innerHTML = '';
            
            if (pageItems.length === 0) {
                list.innerHTML = `<p class="col-span-full text-center py-20 text-zinc-600">No results found for that query.</p>`;
            }

            pageItems.forEach(game => {
                const card = document.createElement('div');
                card.className = 'game-card rounded-2xl cursor-pointer group';
                card.onclick = () => launchGame(game);
                
                // image logic 
                let img = game.image;
                if (!img.startsWith('http') && !img.startsWith('/images')) {
                    img = img.startsWith('/') ? `/images${img}` : `/images/${img}`;
                }

                // adding an onerror to hide the whole card if the image flops
                card.innerHTML = `
                    <div class="img-container rounded-t-2xl relative">
                        <img src="${img}" 
                             class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition-opacity" 
                             loading="lazy" 
                             onerror="this.closest('.game-card').style.display='none'">
                    </div>
                    <div class="p-4">
                        <h3 class="font-bold text-sm truncate text-zinc-100">${game.name}</h3>
                        <p class="text-[10px] text-zinc-500 uppercase mt-1 tracking-widest">${game.type || 'Web App'}</p>
                    </div>
                `;
                list.appendChild(card);
            });

            pageInfo.innerText = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage === totalPages;
        }

        function changePage(dir) {
            currentPage += dir;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            renderGames();
        }

        function handleSearch(query) {
            filteredGames = allGames.filter(g => 
                g.name.toLowerCase().includes(query.toLowerCase())
            );
            currentPage = 1; // reset to first page on search
            renderGames();
        }

        function launchGame(game) {
            const container = document.getElementById('immersive-container');
            const iframe = document.getElementById('game-iframe');
            document.getElementById('immersive-game-title').textContent = game.name;
            iframe.src = game.directory;
            container.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function closeImmersive() {
            const container = document.getElementById('immersive-container');
            const iframe = document.getElementById('game-iframe');
            iframe.src = 'about:blank';
            container.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        function reloadGame() {
            const iframe = document.getElementById('game-iframe');
            const currentSrc = iframe.src;
            iframe.src = 'about:blank';
            setTimeout(() => { iframe.src = currentSrc; }, 10);
        }

        function toggleFullscreen() {
            const container = document.getElementById('immersive-container');
            if (!document.fullscreenElement) {
                container.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }

        window.onload = () => {
            fetchGameList();
            document.getElementById('game-search-input').addEventListener('input', (e) => {
                handleSearch(e.target.value);
            });
        };
    </script>
</body>
</html>
