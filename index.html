<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FyreX Launcher</title>
<style>
  :root {
    --bg: #071024;
    --panel: #0f1724aa;
    --text: #eef2ff;
    --accent1: #6a00ff;
    --accent2: #ff00aa;
    --radius: 12px;
  }
  * {
    box-sizing: border-box;
    margin: 0; padding: 0;
  }
  body {
    font-family: Inter, system-ui, Segoe UI, Roboto, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 20px;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  header {
    font-size: 24px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  main {
    flex-grow: 1;
  }
  #games {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 16px;
  }
  .game-card {
    background: var(--panel);
    border-radius: var(--radius);
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }
  .game-card img {
    width: 140px;
    height: 100px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 8px;
    background: #031018;
  }
  .game-title {
    font-weight: 700;
    margin-bottom: 6px;
  }
  .btn-play {
    margin-top: auto;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    border: none;
    border-radius: 10px;
    padding: 10px 0;
    width: 100%;
    color: var(--text);
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    transition: background 0.3s ease;
  }
  .btn-play:disabled {
    background: #555;
    cursor: default;
  }
  #loader {
    position: fixed;
    inset: 0;
    background: rgba(7, 16, 36, 0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    visibility: hidden;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  #loader.active {
    visibility: visible;
    opacity: 1;
  }
  #loader-text {
    color: var(--text);
    font-weight: 700;
    margin-bottom: 12px;
    font-size: 18px;
  }
  #loader-bar-container {
    width: 320px;
    height: 16px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    overflow: hidden;
  }
  #loader-bar {
    width: 0;
    height: 100%;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    transition: width 0.2s linear;
  }
</style>
</head>
<body>
<header>FyreX Launcher</header>
<main>
  <div id="games" aria-live="polite"></div>
</main>

<div id="loader" role="alert" aria-live="assertive" aria-label="Loading game">
  <div id="loader-text">Loading...</div>
  <div id="loader-bar-container">
    <div id="loader-bar"></div>
  </div>
</div>

<script>
  const gamesJsonUrl = 'games.json';

  const gamesContainer = document.getElementById('games');
  const loader = document.getElementById('loader');
  const loaderBar = document.getElementById('loader-bar');
  const loaderText = document.getElementById('loader-text');

  async function loadGames() {
    try {
      const res = await fetch(gamesJsonUrl, {cache: 'no-store'});
      if (!res.ok) throw new Error('Failed to load games.json');
      const games = await res.json();
      renderGames(games);
    } catch {
      gamesContainer.innerHTML = '<p style="color:#bbb">Failed to load games.json</p>';
    }
  }

  function renderGames(games) {
    if (!Array.isArray(games) || games.length === 0) {
      gamesContainer.innerHTML = '<p style="color:#bbb">No games available</p>';
      return;
    }
    gamesContainer.innerHTML = '';
    games.forEach(game => {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.innerHTML = `
        <img src="${game.directory}/${game.image || 'cover.png'}" alt="${game.name}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22140%22 height=%22100%22><rect width=%22140%22 height=%22100%22 fill=%23031a18%22/><text x=%2270%22 y=%2250%22 fill=%22%23ccc%22 font-size=%2212%22 font-family=%22Arial%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22>No Cover</text></svg>'" />
        <div class="game-title">${game.name}</div>
        <button class="btn-play" type="button">Play</button>
      `;
      const btn = card.querySelector('.btn-play');
      btn.addEventListener('click', () => onPlayClick(game, btn));
      gamesContainer.appendChild(card);
    });
  }

  function onPlayClick(game, button) {
    button.disabled = true;
    loader.classList.add('active');
    loaderText.textContent = `Loading ${game.name}...`;
    loaderBar.style.width = '0%';

    const duration = Math.floor(Math.random() * 10000) + 1000;
    const start = performance.now();

    function animate(time) {
      const elapsed = time - start;
      const progress = Math.min(elapsed / duration, 1);
      loaderBar.style.width = (progress * 100) + '%';
      if (progress < 1) {
        requestAnimationFrame(animate);
      } else {
        window.location.href = `${game.directory}/index.html`;
      }
    }

    requestAnimationFrame(animate);
  }

  loadGames();
</script>
</body>
</html>
