<!DOCTYPE html>
<html>
<head>
  <title>YouTube Unbl*cked - Search & Manual</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width" />
  <style>
    body { background:#121212; color:white; font-family:sans-serif; text-align:center; padding:20px; }
    .tabs{margin-bottom:20px;}
    button.tab-btn{padding:10px 20px;background:#222;border:none;color:white;cursor:pointer;margin-right:5px;border-radius:5px 5px 0 0;font-weight:600;}
    button.tab-btn.active{background:#444;}
    .tab-content{background:#222;padding:20px;border-radius:0 5px 5px 5px;max-width:650px;margin:0 auto;}
    input{padding:10px;font-size:1rem;border-radius:5px;border:none;width:80%;margin-bottom:10px;outline:none;}
    button.search-btn{background:#333;color:white;cursor:pointer;padding:10px 20px;border:none;border-radius:5px;font-weight:600;}
    iframe{margin:15px auto;display:block;border-radius:8px;}
    #results iframe,#manual-video iframe{width:100%;max-width:560px;height:315px;}
    p.message{margin-top:10px;font-style:italic;color:#aaa;}
    .error{color:#ff5555;font-weight:bold;}
  </style>
</head>
<body>
  <h1>YouTube Unbl*cked - Search & Manual Link</h1>

  <div class="tabs">
    <button class="tab-btn active" id="searchTabBtn">Search</button>
    <button class="tab-btn" id="manualTabBtn">Manual Link</button>
  </div>

  <div id="searchTab" class="tab-content">
    <input type="text" id="searchBox" placeholder="Search YouTube videos" />
    <button class="search-btn" onclick="searchVideos()">Search</button>
    <div id="results"></div>
  </div>

  <div id="manualTab" class="tab-content" style="display:none;">
    <input type="text" id="manualUrl" placeholder="Paste YouTube video link or ID" />
    <button class="search-btn" onclick="loadManualVideo()">Watch</button>
    <div id="manual-video"></div>
  </div>

  <script>
    const base = "https://www.youtube-nocookie.com/embed/";
    const end = "?rel=0&modestbranding=1&iv_load_policy=3";

    const searchTabBtn = document.getElementById("searchTabBtn");
    const manualTabBtn = document.getElementById("manualTabBtn");
    const searchTab = document.getElementById("searchTab");
    const manualTab = document.getElementById("manualTab");

    // Tab switching
    searchTabBtn.onclick = () => { searchTabBtn.classList.add("active"); manualTabBtn.classList.remove("active"); searchTab.style.display="block"; manualTab.style.display="none"; }
    manualTabBtn.onclick = () => { manualTabBtn.classList.add("active"); searchTabBtn.classList.remove("active"); manualTab.style.display="block"; searchTab.style.display="none"; }

    // Utility: grab YouTube IDs from HTML
    function extractIds(html){
      return [...html.matchAll(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/g)]
        .map(m=>m[1]);
    }

    // Error display
    function showError(target, code, msg){
      document.getElementById(target).innerHTML = `<p class="message error">Error ${code}: ${msg}</p>`;
    }

    async function searchVideos(){
      const query = document.getElementById("searchBox").value.trim();
      const resultsDiv = document.getElementById("results");

      if(!query){ showError("results","E001","Empty search query"); return; }
      resultsDiv.innerHTML = "<p class='message'>Searching...</p>";

      // Try search engines in order
      const engines = [
        { name:"Bing", url:`https://api.allorigins.win/get?url=${encodeURIComponent("https://www.bing.com/search?q=site:youtube.com+"+query+"+videos")}` },
        { name:"DuckDuckGo", url:`https://api.allorigins.win/get?url=${encodeURIComponent("https://duckduckgo.com/html/?q=site:youtube.com+"+query)}` },
        { name:"Brave", url:`https://api.allorigins.win/get?url=${encodeURIComponent("https://search.brave.com/search?q=site:youtube.com+"+query)}` }
      ];

      let ids = [];
      for(const engine of engines){
        try{
          const res = await fetch(engine.url);
          const data = await res.json();
          ids = extractIds(data.contents);
          ids = [...new Set(ids)];
          if(ids.length>0){ break; } // success
        }catch(e){
          console.warn(`Search ${engine.name} failed`, e);
        }
      }

      resultsDiv.innerHTML="";
      if(ids.length===0){
        showError("results","E003","No videos found or all engines failed.");
        return;
      }

      ids.slice(0,5).forEach(id=>{
        const iframe = document.createElement("iframe");
        iframe.src = base+id+end;
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
        iframe.allowFullscreen = true;
        iframe.frameBorder=0;
        resultsDiv.appendChild(iframe);
      });
    }

    // Manual mode
    function loadManualVideo(){
      const input = document.getElementById("manualUrl").value.trim();
      const manualDiv = document.getElementById("manual-video");
      manualDiv.innerHTML="";

      if(!input){ showError("manual-video","E001","Empty link field"); return; }

      let idMatch = input.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
      let videoId = idMatch ? idMatch[1] : null;
      if(!videoId && input.length===11 && /^[a-zA-Z0-9_-]+$/.test(input)){ videoId=input; }

      if(!videoId){ showError("manual-video","E004","Invalid YouTube link or ID"); return; }

      const iframe=document.createElement("iframe");
      iframe.src=base+videoId+end;
      iframe.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture";
      iframe.allowFullscreen=true;
      iframe.frameBorder=0;
      manualDiv.appendChild(iframe);
    }
  </script>
</body>
</html>
