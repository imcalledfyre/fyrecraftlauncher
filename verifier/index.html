<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>FyreX Link Checker</title>
<style>
  body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
  .domain { display: inline-block; margin: 5px; padding: 10px 15px; border-radius: 12px; cursor: pointer; color: #fff; }
  .green { background: #4caf50; }
  .red { background: #f44336; }
  .yellow { background: #ffeb3b; color: #111; }
  .purple { background: #9c27b0; }
  #status { margin-bottom: 20px; }
</style>
</head>
<body>

<h2>FyreX Domain Status</h2>
<p>Green = probably unblocked</p>
<p>Red = probably blocked (Extension)</p>
<p>Yellow = probably blocked (Network)</p>
<p>Purple = server issue</p>
<div id="status">Connecting...</div>
<div id="domains"></div>
<p>This site uses the FyreX API, meaning it will be updated the MINUTE a new link comes online.</p>
<script>
const ws = new WebSocket('wss://fyrexapi.imcalledfyre.com');
const domainsDiv = document.getElementById('domains');
const statusDiv = document.getElementById('status');

ws.onopen = () => statusDiv.textContent = 'Connected to server...';
ws.onclose = () => statusDiv.textContent = 'Disconnected!';
ws.onerror = () => statusDiv.textContent = 'WebSocket error!';

ws.onmessage = async (event) => {
  domainsDiv.innerHTML = '';
  const data = JSON.parse(event.data); // [{domain, status}, ...]
  
  data.forEach(d => {
    const bubble = document.createElement('div');
    bubble.className = 'domain';
    bubble.textContent = d.domain;

    // Try to fetch /verify.txt
    fetch(`https://${d.domain}/verify.txt`, { method: 'GET', redirect: 'manual' })
      .then(async res => {
        // Check for redirects
        if (res.status >= 300 && res.status < 400) {
          bubble.classList.add('red');
          bubble.title = 'Blocked: Redirected';
        } else {
          const text = await res.text();
          if (text.trim() === 'works') {
            bubble.classList.add('green');
            bubble.title = 'Probably unblocked';
            bubble.onclick = () => window.open(`https://${d.domain}`, '_blank');
          } else {
            bubble.classList.add('red');
            bubble.title = 'Blocked: Verification text incorrect';
          }
        }
      })
      .catch(err => {
        // Check error type
        const msg = err.message.toLowerCase();
        if (msg.includes('network') || msg.includes('failed to fetch')) {
          bubble.classList.add('yellow');
          bubble.title = 'Network restriction / Connection issue';
        } else {
          bubble.classList.add('purple');
          bubble.title = 'Server issue / DNS problem';
        }
      });

    domainsDiv.appendChild(bubble);
  });
};
</script>

</body>
</html>
